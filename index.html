<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>trell0</title>
    <style>
      :root {
        --color-paper: #f9f9f9;
        --color-ink: #1a1a1a;
        --bg: var(--color-paper);
        --fg: var(--color-ink);
        --curve: cubic-bezier(0.16, 1, 0.3, 1);
        --hover: rgba(0, 0, 0, 0.035);
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --color-paper: #0d0d0f;
        --color-ink: #ececed;
        --bg: var(--color-paper);
        --fg: var(--color-ink);
        --hover: rgba(255, 255, 255, 0.05);
        color-scheme: dark;
      }
      :root[data-theme="midnight"] {
        --color-paper: #0b0e1a;
        --color-ink: #b8c5e0;
        --bg: var(--color-paper);
        --fg: var(--color-ink);
        --hover: rgba(255, 255, 255, 0.04);
        color-scheme: dark;
      }
      :root[data-theme="forest"] {
        --color-paper: #0d1610;
        --color-ink: #b8d0b8;
        --bg: var(--color-paper);
        --fg: var(--color-ink);
        --hover: rgba(255, 255, 255, 0.04);
        color-scheme: dark;
      }
      :root[data-theme="sunset"] {
        --color-paper: #fdf3ea;
        --color-ink: #3d2c24;
        --bg: var(--color-paper);
        --fg: var(--color-ink);
        --hover: rgba(0, 0, 0, 0.035);
        color-scheme: light;
      }
      :root[data-theme="solarized-light"] {
        --color-paper: #fdf6e3;
        --color-ink: #657b83;
        --bg: var(--color-paper);
        --fg: var(--color-ink);
        --hover: rgba(0, 0, 0, 0.04);
        color-scheme: light;
      }
      :root[data-theme="catppuccin"] {
        --color-paper: #24273a;
        --color-ink: #cad3f5;
        --bg: var(--color-paper);
        --fg: var(--color-ink);
        --hover: rgba(255, 255, 255, 0.04);
        color-scheme: dark;
      }
      :root[data-theme="solarized-dark"] {
        --color-paper: #002b36;
        --color-ink: #839496;
        --bg: var(--color-paper);
        --fg: var(--color-ink);
        --hover: rgba(255, 255, 255, 0.05);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background-color: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family:
          -apple-system, BlinkMacSystemFont, "Geist Variable", sans-serif;
        transition:
          background-color 0.5s,
          color 0.5s;
      }
      .top-actions {
        position: fixed;
        top: 40px;
        right: 40px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .theme-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 7px;
        line-height: 0;
        border: none;
        background: none;
        color: var(--fg);
        cursor: pointer;
        border-radius: 9px;
        opacity: 0.3;
        -webkit-tap-highlight-color: transparent;
        transition:
          opacity 0.2s var(--curve),
          background-color 0.2s var(--curve);
      }
      .theme-toggle:hover {
        opacity: 0.85;
        background: var(--hover);
      }
      .theme-toggle svg {
        width: 18px;
        height: 18px;
        animation: iconSwap 0.5s var(--curve);
        transition: transform 0.55s var(--curve);
      }
      .theme-toggle:hover svg {
        transform: rotate(35deg) scale(1.06);
      }
      @keyframes iconSwap {
        from {
          opacity: 0;
          transform: rotate(-40deg) scale(0.7);
        }
        to {
          opacity: 1;
          transform: rotate(0) scale(1);
        }
      }
      .landing {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hero {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 400;
        letter-spacing: -0.02em;
        opacity: 0.5;
        text-transform: lowercase;
      }
      .tagline {
        margin: 0;
        font-size: 15px;
        font-weight: 300;
        letter-spacing: -0.01em;
        opacity: 0.25;
      }
      .enter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 8px 16px 8px 20px;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: -0.01em;
        text-transform: lowercase;
        text-decoration: none;
        color: var(--fg);
        border: 1px solid var(--fg);
        border-radius: 100px;
        opacity: 0.25;
        transition:
          opacity 0.3s var(--curve),
          border-color 0.3s var(--curve),
          background-color 0.3s var(--curve);
      }
      .enter:hover {
        opacity: 0.6;
        border-color: var(--fg);
        background: var(--hover);
      }
      .enter svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        stroke-width: 1.6;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      @media (max-width: 640px) {
        .top-actions {
          top: 20px;
          right: 20px;
        }
        .theme-toggle svg {
          width: 20px;
          height: 20px;
        }
      }
      .theme-dropdown {
        position: fixed;
        z-index: 300;
        min-width: 170px;
        background: var(--sidebar, var(--bg));
        border: 1px solid var(--line, rgba(0, 0, 0, 0.06));
        border-radius: 12px;
        box-shadow: 0 16px 48px -12px rgba(0, 0, 0, 0.4);
        padding: 6px;
        opacity: 0;
        transform: scale(0.96) translateY(-4px);
        pointer-events: none;
        transition:
          opacity 0.15s var(--curve, ease),
          transform 0.2s var(--curve, ease);
      }
      .theme-dropdown.open {
        opacity: 1;
        transform: scale(1) translateY(0);
        pointer-events: auto;
      }
      .theme-dropdown-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border: none;
        background: none;
        color: var(--fg);
        font-family: inherit;
        font-size: 13.5px;
        text-align: left;
        cursor: pointer;
        border-radius: 8px;
        transition: background-color 0.12s var(--curve, ease);
      }
      .theme-dropdown-item:hover {
        background: var(--hover);
      }
      .theme-dropdown-item .row-icon {
        width: 18px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.5;
      }
      .theme-dropdown-item .row-icon svg {
        width: 15px;
        height: 15px;
      }
      .theme-dropdown-item .row-label {
        flex: 1;
        opacity: 0.8;
      }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("trell0-theme");
          if (saved) {
            document.documentElement.setAttribute("data-theme", saved);
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="top-actions">
      <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="toggle theme"
        title="toggle theme"
      ></button>
    </div>
    <main class="landing">
      <div class="hero">
        <h1>trell0</h1>
        <p class="tagline">a kanban board for the new generation</p>
        <a class="enter" href="app.html">
          open app
          <svg viewBox="0 0 24 24">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </a>
      </div>
    </main>
    <script>
      var ICON_MOON =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      var ICON_SUN =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg>';
      var ICON_CHECK =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      var ICON_THEME_CMD =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>';

      var THEMES = [
        { id: "light", label: "Light", family: "light" },
        { id: "sunset", label: "Sunset", family: "light" },
        { id: "solarized-light", label: "Solarized Light", family: "light" },
        { id: "dark", label: "Dark", family: "dark" },
        { id: "midnight", label: "Midnight", family: "dark" },
        { id: "forest", label: "Forest", family: "dark" },
        { id: "catppuccin", label: "Catppuccin", family: "dark" },
        { id: "solarized-dark", label: "Solarized Dark", family: "dark" },
      ];

      var themeToggle = document.getElementById("themeToggle");

      function applyTheme(themeId) {
        document.documentElement.setAttribute("data-theme", themeId);
        themeToggle.innerHTML = ICON_THEME_CMD;
        themeToggle.title = "switch theme";
      }

      function currentTheme() {
        return document.documentElement.getAttribute("data-theme") || "light";
      }

      function submitThemeById(id) {
        applyTheme(id);
        try {
          localStorage.setItem("trell0-theme", id);
        } catch (e) {}
      }

      applyTheme(currentTheme());

      var themeDropdownOpen = false;

      function renderThemeDropdown() {
        var dropdown = document.getElementById("themeDropdown");
        if (!dropdown) {
          dropdown = document.createElement("div");
          dropdown.id = "themeDropdown";
          dropdown.className = "theme-dropdown";
          dropdown.role = "listbox";
          document.body.appendChild(dropdown);
        }
        var current = currentTheme();
        dropdown.innerHTML = "";
        THEMES.forEach(function (t) {
          var item = document.createElement("button");
          item.className =
            "theme-dropdown-item" + (t.id === current ? " selected" : "");
          item.type = "button";
          item.innerHTML =
            '<span class="row-icon">' +
            (t.id === current ? ICON_CHECK : "") +
            '</span><span class="row-label">' +
            t.label +
            "</span>";
          item.addEventListener("click", function (e) {
            e.stopPropagation();
            submitThemeById(t.id);
            closeThemeDropdown();
          });
          dropdown.appendChild(item);
        });
      }

      function openThemeDropdown() {
        if (themeDropdownOpen) return;
        renderThemeDropdown();
        var dropdown = document.getElementById("themeDropdown");
        var rect = themeToggle.getBoundingClientRect();
        dropdown.style.position = "fixed";
        dropdown.style.top = rect.bottom + 6 + "px";
        dropdown.style.right = window.innerWidth - rect.right + "px";
        requestAnimationFrame(function () {
          dropdown.classList.add("open");
        });
        themeDropdownOpen = true;
        document.addEventListener("keydown", themeDropdownKeyHandler);
        setTimeout(function () {
          document.addEventListener("click", themeDropdownOutsideHandler);
        }, 0);
      }

      function closeThemeDropdown() {
        var dropdown = document.getElementById("themeDropdown");
        if (!dropdown) return;
        dropdown.classList.remove("open");
        themeDropdownOpen = false;
        document.removeEventListener("keydown", themeDropdownKeyHandler);
        document.removeEventListener("click", themeDropdownOutsideHandler);
      }

      function themeDropdownKeyHandler(e) {
        if (e.key === "Escape") closeThemeDropdown();
      }

      function themeDropdownOutsideHandler(e) {
        var dropdown = document.getElementById("themeDropdown");
        if (!dropdown || !themeDropdownOpen) return;
        if (dropdown.contains(e.target) || themeToggle.contains(e.target))
          return;
        closeThemeDropdown();
      }

      themeToggle.addEventListener("click", function () {
        if (themeDropdownOpen) closeThemeDropdown();
        else openThemeDropdown();
      });
    </script>
  </body>
</html>
