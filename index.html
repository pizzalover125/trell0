<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>trell0</title>
    <style>
      :root {
        --color-paper: #f9f9f9;
        --color-ink: #1a1a1a;
        --color-shelf: #ffffff;

        --bg: var(--color-paper);
        --fg: var(--color-ink);
        --sidebar: var(--color-shelf);
        --curve: cubic-bezier(0.16, 1, 0.3, 1);

        --card: #ffffff;
        --line: rgba(0, 0, 0, 0.06);
        --hover: rgba(0, 0, 0, 0.035);
        --card-shadow: 0 6px 20px -8px rgba(0, 0, 0, 0.25);

        color-scheme: light;
      }

      :root[data-theme="dark"] {
        --color-paper: #0d0d0f;
        --color-ink: #ececed;
        --color-shelf: #161618;

        --card: #1a1a1d;
        --line: rgba(255, 255, 255, 0.08);
        --hover: rgba(255, 255, 255, 0.05);
        --card-shadow: 0 10px 28px -12px rgba(0, 0, 0, 0.75);

        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family:
          -apple-system, BlinkMacSystemFont, "Geist Variable", sans-serif;
        transition:
          background-color 0.5s,
          color 0.5s;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .topbar {
        position: fixed;
        top: 40px;
        left: 40px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }
      .logo-mark {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1px solid var(--fg);
        opacity: 0.2;
      }
      .topbar h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: -0.02em;
        text-transform: lowercase;
        opacity: 0.5;
      }

      .theme-toggle {
        position: fixed;
        top: 40px;
        right: 40px;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 7px;
        line-height: 0;
        border: none;
        background: none;
        color: var(--fg);
        cursor: pointer;
        border-radius: 9px;
        opacity: 0.3;
        -webkit-tap-highlight-color: transparent;
        transition:
          opacity 0.2s var(--curve),
          background-color 0.2s var(--curve);
      }
      .theme-toggle:hover {
        opacity: 0.85;
        background: var(--hover);
      }
      .theme-toggle svg {
        width: 18px;
        height: 18px;
        animation: iconSwap 0.5s var(--curve);
        transition: transform 0.55s var(--curve);
      }
      .theme-toggle:hover svg {
        transform: rotate(35deg) scale(1.06);
      }
      @keyframes iconSwap {
        from {
          opacity: 0;
          transform: rotate(-40deg) scale(0.7);
        }
        to {
          opacity: 1;
          transform: rotate(0) scale(1);
        }
      }

      .board {
        height: 100%;
        width: 100%;
        display: flex;
        gap: 22px;
        align-items: flex-start;
        padding: 56px 40px 40px;
        overflow-x: auto;
        overflow-y: hidden;
      }

      .column {
        flex: 0 0 320px;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .column-header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 8px 6px 14px;
      }
      .column-header .title {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: -0.02em;
        text-transform: lowercase;
        opacity: 0.6;
      }
      .column-header .count {
        font-size: 12px;
        font-weight: 400;
        opacity: 0.25;
        letter-spacing: -0.01em;
      }

      .cards {
        position: relative;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding-bottom: 0;
        min-height: 12px;
        transition: background-color 0.2s var(--curve);
        border-radius: 16px;
      }
      .cards.drag-over {
        background-color: var(--hover);
      }

      .card {
        position: relative;
        background: var(--card-bg, var(--card));
        color: var(--card-fg, var(--fg));
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 38px 14px 16px;
        margin-bottom: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 300;
        line-height: 1.5;
        letter-spacing: -0.01em;
        transition:
          transform 0.25s var(--curve),
          box-shadow 0.25s var(--curve),
          opacity 0.25s var(--curve),
          border-color 0.25s var(--curve),
          background-color 0.4s var(--curve),
          color 0.4s var(--curve);
      }
      .card:hover {
        transform: translateY(-1px);
        border-color: color-mix(in srgb, var(--fg) 14%, transparent);
        box-shadow: var(--card-shadow);
      }
      .card.dragging {
        opacity: 0.35;
      }
      .card-enter {
        animation: cardEnter 520ms var(--curve) both;
      }
      .card-removing {
        pointer-events: none;
        z-index: 5;
        animation: cardRemove 520ms var(--curve) forwards;
      }
      @keyframes cardEnter {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.96);
          filter: blur(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }
      @keyframes cardRemove {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        40% {
          opacity: 0.5;
          transform: translateY(-3px) scale(0.985);
        }
        100% {
          opacity: 0;
          transform: translateY(-10px) scale(0.94);
          filter: blur(6px);
        }
      }
      .card.empty .card-title {
        opacity: 0.25;
      }
      .card-title {
        display: block;
        text-transform: none;
        overflow-wrap: break-word;
        word-break: break-word;
      }
      .card-x {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        padding: 5px;
        line-height: 0;
        border: none;
        background: none;
        color: inherit;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.2s var(--curve);
      }
      .card:hover .card-x {
        opacity: 0.35;
      }
      .card-x:hover {
        opacity: 1 !important;
      }

      .add-card {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin-top: 4px;
        padding: 12px 16px 12px 6px;
        border: none;
        background: none;
        color: var(--fg);
        cursor: pointer;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: -0.01em;
        text-transform: lowercase;
        opacity: 0.4;
        transition:
          opacity 0.2s,
          background-color 0.2s;
      }
      .add-card:hover {
        opacity: 0.9;
        background: var(--hover);
      }

      .icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }

      .editor-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s var(--curve);
      }
      .editor-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }
      .editor-backdrop {
        position: absolute;
        inset: 0;
        background: color-mix(in srgb, var(--bg) 65%, transparent);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }
      .editor-modal {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 540px;
        max-height: 76vh;
        padding: 22px 24px 18px;
        background: var(--sidebar);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 30px 80px -24px rgba(0, 0, 0, 0.45);
        opacity: 0;
        transform: scale(0.985) translateY(8px);
        transition:
          opacity 0.4s var(--curve),
          transform 0.5s var(--curve),
          background-color 0.5s,
          border-color 0.5s;
      }
      .editor-overlay.open .editor-modal {
        opacity: 1;
        transform: scale(1) translateY(0);
      }

      .editor-close {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 2;
        padding: 6px;
        line-height: 0;
        border: none;
        background: none;
        color: var(--fg);
        cursor: pointer;
        opacity: 0.25;
        transition: opacity 0.2s var(--curve);
      }
      .editor-close:hover {
        opacity: 0.9;
      }

      .status-wrap {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        padding-right: 34px;
      }
      .status-bar {
        font-size: 13px;
        font-weight: 300;
        letter-spacing: -0.02em;
        text-transform: lowercase;
        color: var(--fg);
        transition:
          opacity 0.3s var(--curve),
          transform 0.3s var(--curve),
          filter 0.3s var(--curve);
      }
      .status-visible {
        opacity: 0.4;
        transform: translateY(0);
      }
      .status-hidden {
        opacity: 0;
        transform: translateY(-5px);
      }
      .status-bar:hover {
        opacity: 1;
      }

      .card-color-picker {
        margin-top: 14px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 7px;
        opacity: 0;
        transform: translateY(-4px);
        pointer-events: none;
        transition:
          opacity 0.25s var(--curve),
          transform 0.25s var(--curve);
      }
      .editor-overlay.open .card-color-picker {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      .color-dot {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--fg) 15%, transparent);
        background: var(--dot);
        cursor: pointer;
        opacity: 0.5;
        transform: scale(1);
        transition:
          opacity 0.2s var(--curve),
          transform 0.2s var(--curve),
          border-color 0.2s var(--curve);
      }
      .color-dot:hover {
        opacity: 0.9;
        transform: scale(1.06);
      }
      .color-dot.active {
        opacity: 1;
        transform: scale(1.1);
        border-color: color-mix(in srgb, var(--fg) 35%, transparent);
      }

      .editor-scroll {
        flex: 1;
        min-height: 0;
        width: 100%;
        padding: 4px 2px 6px;
        overflow-y: auto;
        scroll-behavior: smooth;
      }
      .editor-wrap {
        width: 100%;
        max-width: 100%;
        position: relative;
      }

      .custom-cursor {
        position: absolute;
        width: 1.5px;
        height: 1.2em;
        background: var(--fg);
        opacity: 0.4;
        pointer-events: none;
        z-index: 10;
        transform: translateY(15%);
        will-change: left, top;
        transition:
          left 80ms cubic-bezier(0.16, 1, 0.3, 1),
          top 80ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .text-base-style {
        font-family: inherit;
        font-size: 16px;
        font-weight: 300;
        line-height: 1.6;
        letter-spacing: -0.01em;
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-wrap: break-word;
        display: block;
        width: 100%;
        min-height: 160px;
        outline: none;
        color: var(--fg);
        caret-color: transparent !important;
      }

      [contenteditable] {
        caret-color: transparent !important;
      }
      [contenteditable]:empty:before {
        content: attr(data-placeholder);
        color: var(--fg);
        opacity: 0.2;
        pointer-events: none;
      }

      .char-fade {
        display: inline-block;
        opacity: 0;
        animation: char-entry 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity;
      }
      .char-fade.stable {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      @keyframes char-entry {
        from {
          opacity: 0;
          transform: translateY(2px);
          filter: blur(2px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      @media (max-width: 640px) {
        .topbar {
          top: 16px;
          left: 16px;
        }
        .board {
          gap: 14px;
          padding: 44px 16px 24px;
          scroll-snap-type: x mandatory;
          -webkit-overflow-scrolling: touch;
        }
        .column {
          flex: 0 0 85vw;
          scroll-snap-align: center;
        }
        .theme-toggle {
          top: 14px;
          right: 16px;
          padding: 10px;
        }
        .theme-toggle svg {
          width: 20px;
          height: 20px;
        }
        .card {
          padding: 16px 40px 16px 16px;
          font-size: 16px;
          margin-bottom: 10px;
          border-radius: 16px;
          -webkit-tap-highlight-color: transparent;
        }
        .card-x {
          opacity: 0.35;
          padding: 8px;
        }
        .card-x svg {
          width: 16px;
          height: 16px;
        }
        .add-card {
          padding: 14px 16px 14px 8px;
          font-size: 15px;
          min-height: 48px;
        }
        .add-card .icon {
          width: 20px;
          height: 20px;
        }
        .editor-overlay {
          padding: 12px;
          align-items: flex-end;
        }
        .editor-modal {
          max-width: 100%;
          max-height: 85vh;
          padding: 20px 16px 16px;
          border-radius: 20px 20px 0 0;
          transform: translateY(20px);
        }
        .editor-scroll {
          max-height: 60vh;
        }
        .editor-close {
          padding: 10px;
          top: 12px;
          right: 12px;
        }
        .text-base-style {
          font-size: 16px;
          min-height: 120px;
        }
        .card-color-picker {
          gap: 10px;
          padding-bottom: env(safe-area-inset-bottom, 8px);
        }
        .color-dot {
          width: 20px;
          height: 20px;
          padding: 0;
          min-width: 20px;
        }
        .status-bar {
          font-size: 14px;
        }
      }

      @media (max-width: 380px) {
        .board {
          padding: 40px 12px 20px;
          gap: 12px;
        }
        .column {
          flex: 0 0 88vw;
        }
        .column-header {
          padding: 6px 4px 10px;
        }
        .editor-modal {
          padding: 16px 12px 12px;
        }
      }

      @media (min-width: 641px) and (max-width: 1024px) {
        .board {
          padding: 56px 24px 32px;
          gap: 18px;
        }
        .column {
          flex: 0 0 280px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("trell0-theme");
          var theme =
            saved === "dark" || saved === "light"
              ? saved
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="board no-scrollbar" id="board"></div>

    <button
      class="theme-toggle"
      id="themeToggle"
      aria-label="toggle theme"
      title="toggle theme"
    ></button>

    <div class="editor-overlay" id="overlay">
      <div class="editor-backdrop" id="backdrop"></div>
      <div class="editor-modal" id="modal">
        <button class="editor-close" id="closeBtn" title="close (esc)"></button>
        <div class="status-wrap">
          <div class="status-bar status-visible" id="status">0 words</div>
        </div>
        <div class="editor-scroll no-scrollbar">
          <div class="editor-wrap">
            <div class="custom-cursor" id="cursor"></div>
            <div
              id="editor"
              class="text-base-style"
              contenteditable="true"
              spellcheck="false"
              data-placeholder="start writing..."
            ></div>
          </div>
        </div>
        <div class="card-color-picker" id="cardColorPicker"></div>
      </div>
    </div>

    <script>
      const ICON_PLUS =
        '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>';
      const ICON_X =
        '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>';
      const ICON_X_LG =
        '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>';
      const ICON_MOON =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      const ICON_SUN =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg>';

      document.getElementById("closeBtn").innerHTML = ICON_X_LG;

      const COLUMNS = [
        { title: "to do", cards: [] },
        { title: "in progress", cards: [] },
        { title: "done", cards: [] },
      ];

      const STORAGE_KEY = "trell0-board-state";
      const CARD_COLORS = [
        "",
        "#FFB3B3",
        "#FFD9B3",
        "#FFFFE0",
        "#B3FFB3",
        "#B3FFFF",
        "#B3B3FF",
        "#FFB3FF",
      ];

      let uid = 1;

      function getCleanText(html) {
        if (!html) return "";
        const doc = new DOMParser().parseFromString(html, "text/html");
        return doc.body.textContent || "";
      }
      function esc(c) {
        return c
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function titleFromBody(body) {
        return getCleanText(body).trim().split("\n")[0] || "untitled";
      }

      const board = document.getElementById("board");

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return COLUMNS;
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return COLUMNS;
          return parsed.map((col, i) => ({
            title: col.title || COLUMNS[i]?.title || "untitled",
            cards: Array.isArray(col.cards)
              ? col.cards.map((item) => {
                  if (typeof item === "string")
                    return { body: item, color: "" };
                  return {
                    body: item?.body || "",
                    color: item?.color || "",
                  };
                })
              : [],
          }));
        } catch {
          return COLUMNS;
        }
      }

      let state = loadState();

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch {}
      }

      function syncStateFromDOM() {
        state = [...board.querySelectorAll(".column")].map((col) => ({
          title: col.querySelector(".title")?.textContent || "untitled",
          cards: [...col.querySelectorAll(".card:not(.card-removing)")].map(
            (card) => ({
              body: card.dataset.body || "",
              color: card.dataset.color || "",
            }),
          ),
        }));
      }

      function makeCard(input) {
        const body = typeof input === "string" ? input : input?.body || "";
        const color = typeof input === "string" ? "" : input?.color || "";
        const card = document.createElement("div");
        card.className = "card card-enter";
        card.draggable = true;
        card.dataset.id = "c" + uid++;
        card.dataset.body = body || "";
        card.dataset.color = color;

        const title = document.createElement("span");
        title.className = "card-title";
        card.appendChild(title);

        const x = document.createElement("button");
        x.className = "card-x";
        x.innerHTML = ICON_X;
        card.appendChild(x);

        refreshCard(card);

        card.addEventListener("click", () => openEditor(card));
        x.addEventListener("click", (e) => {
          e.stopPropagation();
          const add = card.closest(".column").querySelector(".add-card");

          const movers = [];
          let sib = card.nextElementSibling;
          while (sib) {
            if (sib.classList.contains("card")) movers.push(sib);
            sib = sib.nextElementSibling;
          }
          movers.push(add);
          const fromTops = movers.map((el) => el.getBoundingClientRect().top);

          const offTop = card.offsetTop;
          const w = card.offsetWidth;
          card.style.position = "absolute";
          card.style.top = offTop + "px";
          card.style.left = "0";
          card.style.width = w + "px";
          card.style.margin = "0";
          card.classList.add("card-removing");

          movers.forEach((el, i) => animateAddButton(el, fromTops[i]));

          syncStateFromDOM();
          updateCounts();
          saveState();

          card.addEventListener(
            "animationend",
            () => {
              card.remove();
            },
            { once: true },
          );
        });

        card.addEventListener("dragstart", () => {
          dragged = card;
          card.classList.add("dragging");
        });
        card.addEventListener("dragend", () => {
          card.classList.remove("dragging");
          dragged = null;
          document
            .querySelectorAll(".cards.drag-over")
            .forEach((c) => c.classList.remove("drag-over"));
        });

        return card;
      }

      function refreshCard(card) {
        const body = card.dataset.body;
        const clean = titleFromBody(body);
        card.querySelector(".card-title").textContent = clean;
        card.classList.toggle("empty", !getCleanText(body).trim());
        if (card.dataset.color) {
          card.style.setProperty("--card-bg", card.dataset.color);
          card.style.setProperty("--card-fg", "#1a1a1a");
        } else {
          card.style.removeProperty("--card-bg");
          card.style.removeProperty("--card-fg");
        }
      }

      function buildBoard() {
        board.innerHTML = "";
        state.forEach((col, colIndex) => {
          const column = document.createElement("div");
          column.className = "column";

          const header = document.createElement("div");
          header.className = "column-header";
          header.innerHTML =
            '<span class="title">' +
            col.title +
            '</span><span class="count"></span>';
          column.appendChild(header);

          const cards = document.createElement("div");
          cards.className = "cards no-scrollbar";
          column.appendChild(cards);

          col.cards.forEach((text) => cards.appendChild(makeCard(text)));

          const add = document.createElement("button");
          add.className = "add-card";
          add.innerHTML = ICON_PLUS + "<span>add card</span>";
          add.addEventListener("click", () => {
            const addTop = add.getBoundingClientRect().top;
            const c = makeCard({ body: "", color: "" });
            cards.appendChild(c);

            state[colIndex].cards.push({ body: "", color: "" });
            updateCounts();
            saveState();
            animateAddButton(add, addTop);

            setTimeout(() => {
              c.classList.remove("card-enter");
            }, 520);
          });
          column.appendChild(add);

          cards.addEventListener("dragover", (e) => {
            e.preventDefault();
            cards.classList.add("drag-over");
            if (!dragged) return;
            const after = afterElement(cards, e.clientY);
            if (after == null) cards.appendChild(dragged);
            else cards.insertBefore(dragged, after);
          });
          cards.addEventListener("dragleave", (e) => {
            if (!cards.contains(e.relatedTarget))
              cards.classList.remove("drag-over");
          });
          cards.addEventListener("drop", (e) => {
            e.preventDefault();
            cards.classList.remove("drag-over");
            syncStateFromDOM();
            updateCounts();
            saveState();
          });

          board.appendChild(column);
        });
        updateCounts();
      }

      function afterElement(container, y) {
        const els = [...container.querySelectorAll(".card:not(.dragging)")];
        let closest = { offset: -Infinity, el: null };
        for (const el of els) {
          const box = el.getBoundingClientRect();
          const offset = y - box.top - box.height / 2;
          if (offset < 0 && offset > closest.offset) closest = { offset, el };
        }
        return closest.el;
      }

      function animateAddButton(add, fromTop) {
        const toTop = add.getBoundingClientRect().top;
        const delta = fromTop - toTop;
        if (!delta) return;
        const easing =
          getComputedStyle(document.documentElement)
            .getPropertyValue("--curve")
            .trim() || "cubic-bezier(0.16, 1, 0.3, 1)";
        add.getAnimations().forEach((anim) => anim.cancel());
        add.animate(
          [
            { transform: `translateY(${delta}px)` },
            { transform: "translateY(0)" },
          ],
          { duration: 520, easing },
        );
      }

      function updateCounts() {
        document.querySelectorAll(".column").forEach((col) => {
          const n = col.querySelectorAll(".card:not(.card-removing)").length;
          col.querySelector(".count").textContent = n;
        });
      }

      let dragged = null;

      const overlay = document.getElementById("overlay");
      const backdrop = document.getElementById("backdrop");
      const editor = document.getElementById("editor");
      const cursorEl = document.getElementById("cursor");
      const statusBar = document.getElementById("status");
      const closeBtn = document.getElementById("closeBtn");
      const cardColorPicker = document.getElementById("cardColorPicker");

      let activeCard = null;
      let isTyping = false;
      let syncTimeout = null;
      let typingTimeout = null;

      function renderColorPicker() {
        cardColorPicker.innerHTML = "";
        CARD_COLORS.forEach((color, i) => {
          const dot = document.createElement("button");
          dot.className = "color-dot";
          dot.type = "button";
          dot.style.setProperty("--dot", color || "var(--card)");
          dot.title = i === 0 ? "default" : "set card color";
          dot.addEventListener("click", () => {
            if (!activeCard) return;
            activeCard.dataset.color = color;
            refreshCard(activeCard);
            syncStateFromDOM();
            saveState();
            syncColorPickerState();
          });
          cardColorPicker.appendChild(dot);
        });
      }

      function syncColorPickerState() {
        const selected = activeCard?.dataset.color || "";
        [...cardColorPicker.querySelectorAll(".color-dot")].forEach(
          (dot, i) => {
            dot.classList.toggle("active", CARD_COLORS[i] === selected);
          },
        );
      }

      function setTyping(t) {
        isTyping = t;
        statusBar.classList.toggle("status-hidden", t);
        statusBar.classList.toggle("status-visible", !t);
      }

      function updateWordCount() {
        const text = getCleanText(editor.innerHTML).trim();
        const wc = text ? text.split(/\s+/).length : 0;
        statusBar.textContent = wc + (wc === 1 ? " word" : " words");
      }

      function updateCursorPos() {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0 || !editor) return;

        const range = selection.getRangeAt(0).cloneRange();
        let rect;

        if (range.collapsed) {
          const dummy = document.createElement("span");
          dummy.textContent = "\u200b";
          range.insertNode(dummy);
          rect = dummy.getBoundingClientRect();
          const parent = dummy.parentNode;
          if (parent) {
            parent.removeChild(dummy);
            parent.normalize();
          }
        } else {
          rect = range.getBoundingClientRect();
        }

        if (rect) {
          const editorRect = editor.getBoundingClientRect();
          cursorEl.style.left = rect.left - editorRect.left + "px";
          cursorEl.style.top = rect.top - editorRect.top + "px";
        }
      }

      function edit() {
        if (!editor) return;
        const val = editor.innerHTML;

        setTyping(true);
        if (typingTimeout) clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => setTyping(false), 800);

        if (syncTimeout) clearTimeout(syncTimeout);
        syncTimeout = setTimeout(() => {
          if (activeCard) {
            activeCard.dataset.body = val;
            refreshCard(activeCard);
            syncStateFromDOM();
            saveState();
          }
        }, 1000);

        updateWordCount();
        updateCursorPos();
      }

      function handleKeyDown(e) {
        const isMod = e.metaKey || e.ctrlKey;

        if (e.key === "Escape") {
          closeEditor();
          return;
        }

        if (e.key === "Enter") {
          editor
            .querySelectorAll(".char-fade:not(.stable)")
            .forEach((el) => el.classList.add("stable"));
          setTimeout(() => {
            edit();
            updateCursorPos();
          }, 10);
          return;
        }

        if (e.key.length === 1 && !isMod) {
          e.preventDefault();
          const char = e.key === " " ? "&nbsp;" : esc(e.key);
          const html = '<span class="char-fade">' + char + "</span>";
          document.execCommand("insertHTML", false, html);

          const lastChar = editor.querySelector(".char-fade:not(.stable)");
          if (lastChar) setTimeout(() => lastChar.classList.add("stable"), 400);

          edit();
        }

        if (e.key === "Tab") {
          e.preventDefault();
          document.execCommand("insertHTML", false, "&nbsp;&nbsp;");
          edit();
        }

        setTimeout(updateCursorPos, 0);
      }

      editor.addEventListener("input", edit);
      editor.addEventListener("keydown", handleKeyDown);
      editor.addEventListener("mouseup", updateCursorPos);
      editor.addEventListener("keyup", updateCursorPos);

      function openEditor(card) {
        if (activeCard === card) return;
        if (activeCard) closeEditor();

        activeCard = card;

        editor.innerHTML = card.dataset.body || "";
        editor
          .querySelectorAll(".char-fade")
          .forEach((el) => el.classList.add("stable"));

        setTyping(false);
        updateWordCount();
        syncColorPickerState();

        overlay.classList.add("open");
        requestAnimationFrame(() => {
          editor.focus();
          const range = document.createRange();
          const sel = window.getSelection();
          range.selectNodeContents(editor);
          range.collapse(false);
          sel.removeAllRanges();
          sel.addRange(range);
          requestAnimationFrame(updateCursorPos);
        });
      }

      function closeEditor() {
        if (!activeCard) return;
        if (syncTimeout) clearTimeout(syncTimeout);
        activeCard.dataset.body = editor.innerHTML;
        refreshCard(activeCard);
        syncStateFromDOM();
        saveState();
        activeCard = null;
        overlay.classList.remove("open");
      }

      backdrop.addEventListener("click", () => closeEditor());

      closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        closeEditor();
      });

      const themeToggle = document.getElementById("themeToggle");

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        themeToggle.innerHTML = theme === "dark" ? ICON_SUN : ICON_MOON;
        themeToggle.title =
          theme === "dark" ? "switch to light" : "switch to dark";
      }

      function currentTheme() {
        return document.documentElement.getAttribute("data-theme") === "dark"
          ? "dark"
          : "light";
      }

      applyTheme(currentTheme());

      themeToggle.addEventListener("click", () => {
        const next = currentTheme() === "dark" ? "light" : "dark";
        applyTheme(next);
        try {
          localStorage.setItem("trell0-theme", next);
        } catch {}
      });

      const themeMedia =
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
      if (themeMedia && themeMedia.addEventListener) {
        themeMedia.addEventListener("change", (e) => {
          let saved;
          try {
            saved = localStorage.getItem("trell0-theme");
          } catch {}
          if (saved !== "dark" && saved !== "light") {
            applyTheme(e.matches ? "dark" : "light");
          }
        });
      }

      buildBoard();
      renderColorPicker();
    </script>
  </body>
</html>
