<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>trell0</title>
    <style>
      :root {
        --color-paper: #f9f9f9;
        --color-ink: #1a1a1a;
        --bg: var(--color-paper);
        --fg: var(--color-ink);
        --curve: cubic-bezier(0.16, 1, 0.3, 1);
        --hover: rgba(0, 0, 0, 0.035);
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --color-paper: #0d0d0f;
        --color-ink: #ececed;
        --bg: var(--color-paper);
        --fg: var(--color-ink);
        --hover: rgba(255, 255, 255, 0.05);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background-color: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family:
          -apple-system, BlinkMacSystemFont, "Geist Variable", sans-serif;
        transition:
          background-color 0.5s,
          color 0.5s;
      }
      .top-actions {
        position: fixed;
        top: 40px;
        right: 40px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .theme-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 7px;
        line-height: 0;
        border: none;
        background: none;
        color: var(--fg);
        cursor: pointer;
        border-radius: 9px;
        opacity: 0.3;
        -webkit-tap-highlight-color: transparent;
        transition:
          opacity 0.2s var(--curve),
          background-color 0.2s var(--curve);
      }
      .theme-toggle:hover {
        opacity: 0.85;
        background: var(--hover);
      }
      .theme-toggle svg {
        width: 18px;
        height: 18px;
        animation: iconSwap 0.5s var(--curve);
        transition: transform 0.55s var(--curve);
      }
      .theme-toggle:hover svg {
        transform: rotate(35deg) scale(1.06);
      }
      @keyframes iconSwap {
        from {
          opacity: 0;
          transform: rotate(-40deg) scale(0.7);
        }
        to {
          opacity: 1;
          transform: rotate(0) scale(1);
        }
      }
      .landing {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hero {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 400;
        letter-spacing: -0.02em;
        opacity: 0.5;
        text-transform: lowercase;
      }
      .tagline {
        margin: 0;
        font-size: 15px;
        font-weight: 300;
        letter-spacing: -0.01em;
        opacity: 0.25;
      }
      .enter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 8px 16px 8px 20px;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: -0.01em;
        text-transform: lowercase;
        text-decoration: none;
        color: var(--fg);
        border: 1px solid var(--fg);
        border-radius: 100px;
        opacity: 0.25;
        transition:
          opacity 0.3s var(--curve),
          border-color 0.3s var(--curve),
          background-color 0.3s var(--curve);
      }
      .enter:hover {
        opacity: 0.6;
        border-color: var(--fg);
        background: var(--hover);
      }
      .enter svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        stroke-width: 1.6;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      @media (max-width: 640px) {
        .top-actions {
          top: 20px;
          right: 20px;
        }
        .theme-toggle svg {
          width: 20px;
          height: 20px;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("trell0-theme");
          var theme =
            saved === "dark" || saved === "light"
              ? saved
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="top-actions">
      <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="toggle theme"
        title="toggle theme"
      ></button>
    </div>
    <main class="landing">
      <div class="hero">
        <h1>trell0</h1>
        <p class="tagline">a kanban board for the new generation</p>
        <a class="enter" href="app.html">
          open app
          <svg viewBox="0 0 24 24">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </a>
      </div>
    </main>
    <script>
      var ICON_MOON =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      var ICON_SUN =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg>';

      var themeToggle = document.getElementById("themeToggle");

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        themeToggle.innerHTML = theme === "dark" ? ICON_SUN : ICON_MOON;
        themeToggle.title =
          theme === "dark " ? "switch to light" : "switch to dark";
      }

      function currentTheme() {
        return document.documentElement.getAttribute("data-theme") === "dark"
          ? "dark"
          : "light";
      }

      applyTheme(currentTheme());

      themeToggle.addEventListener("click", function () {
        var next = currentTheme() === "dark" ? "light" : "dark";
        applyTheme(next);
        try {
          localStorage.setItem("trell0-theme", next);
        } catch (e) {}
      });
    </script>
  </body>
</html>
