<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>trell0</title>
    <link rel="stylesheet" href="landing.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("trell0-theme");
          if (saved) {
            document.documentElement.setAttribute("data-theme", saved);
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="top-actions">
      <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="toggle theme"
        title="toggle theme"
      ></button>
    </div>
    <main class="landing">
      <div class="hero">
        <h1>trell0</h1>
        <p class="tagline">a kanban board for the new generation</p>
        <a class="enter" href="app.html">
          open app
          <svg viewBox="0 0 24 24">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </a>
      </div>
    </main>
    <script type="module" src="landing.js"></script>
  </body>
</html>
