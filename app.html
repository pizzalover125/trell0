<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>trell0</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("trell0-theme");
          if (saved) {
            document.documentElement.setAttribute("data-theme", saved);
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="board no-scrollbar" id="board"></div>

    <div class="top-actions" id="topActions">
      <button
        class="top-action"
        id="paletteBtn"
        aria-label="command palette"
        title="command palette (⌘⇧P)"
      ></button>
      <button
        class="top-action"
        id="importBtn"
        aria-label="import board"
        title="import board"
      ></button>
      <button
        class="top-action"
        id="exportBtn"
        aria-label="export board"
        title="export board"
      ></button>
      <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="toggle theme"
        title="toggle theme"
      ></button>
    </div>
    <input type="file" id="importInput" accept=".json" hidden />

    <div class="editor-overlay" id="overlay">
      <div class="editor-backdrop" id="backdrop"></div>
      <div class="editor-modal" id="modal">
        <button class="editor-close" id="closeBtn" title="close (esc)"></button>
        <div class="status-wrap">
          <div class="status-bar status-visible" id="status">0 words</div>
          <div class="editor-tags-area" id="editorTagsArea"></div>
        </div>
        <div class="editor-scroll no-scrollbar">
          <div class="editor-wrap">
            <div class="custom-cursor" id="cursor"></div>
            <div
              id="editor"
              class="text-base-style"
              contenteditable="true"
              spellcheck="false"
              data-placeholder="start writing..."
            ></div>
          </div>
        </div>
        <div class="card-color-picker" id="cardColorPicker"></div>
      </div>
    </div>

    <div class="palette-overlay" id="paletteOverlay">
      <div class="palette-backdrop" id="paletteBackdrop"></div>
      <div
        class="palette"
        id="palette"
        role="dialog"
        aria-label="command palette"
      >
        <div class="palette-input-row">
          <div class="palette-lead" id="paletteLead"></div>
          <input
            type="text"
            class="palette-input"
            id="paletteInput"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="type a command…"
          />
        </div>
        <div class="palette-divider"></div>
        <div class="palette-body no-scrollbar" id="paletteBody"></div>
        <div class="palette-footer" id="paletteFooter">
          <span class="fk"><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
          <span class="fk"><kbd>↵</kbd> select</span>
          <span class="fk"><kbd>esc</kbd> close</span>
        </div>
      </div>
    </div>

    <div class="timer-stack" id="timerStack" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
